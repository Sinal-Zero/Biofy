name: Biofy AI and preview refinement

on:
  push:
    paths:
      - .github/workflows/refine-ai-preview-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply reviewed UI and agent fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {count}")
              return updated

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Biofy AI panel and composer.
          p = Path("src/components/dashboard/BioAiAssistant.tsx")
          text = p.read_text()
          text = text.replace('import { useEffect, useRef, useState } from "react";', 'import { useState } from "react";')
          text = sub_once(text, r'\nconst quickPrompts = \[[\s\S]*?\];\n', '\n', 'remove quick prompts')
          text = sub_once(
              text,
              r'  const \[instruction, setInstruction\] = useState\(""\);[\s\S]*?(?=  async function applyResult)',
              dedent('''
                const [instruction, setInstruction] = useState("");
                const [loading, setLoading] = useState(false);
                const [messages, setMessages] = useState<ChatMessage[]>([]);

          '''),
              'replace AI local state',
          )

          new_apply = dedent('''
            async function applyResult(payload: AiResult) {
              let appliedMutations = 0;
              const profilePatch: { bio?: string; display_name?: string } = {};
              const currentBio = bundle.profile.bio ?? "";

              if (typeof payload.bio === "string" && payload.bio !== currentBio) {
                profilePatch.bio = payload.bio.slice(0, 240);
              }

              const displayName = payload.profile?.displayName?.trim();
              if (displayName && displayName !== (bundle.profile.display_name ?? "")) {
                profilePatch.display_name = displayName.slice(0, 100);
              }

              if (Object.keys(profilePatch).length > 0) {
                patchProfile(profilePatch);
                appliedMutations += 1;
              }
              if (payload.theme && Object.keys(payload.theme).length > 0) {
                patchTheme(payload.theme);
                appliedMutations += 1;
              }

              const blockPatches = new Map<string, AiBlockUpdate>();
              for (const update of payload.blocks ?? []) {
                if (update?.id) blockPatches.set(update.id, update);
              }
              for (const update of payload.linkTitles ?? []) {
                if (!update?.id || !update.title) continue;
                blockPatches.set(update.id, {
                  ...blockPatches.get(update.id),
                  id: update.id,
                  title: update.title,
                });
              }

              for (const update of blockPatches.values()) {
                const current = bundle.blocks.find((block) => block.id === update.id);
                if (!current) continue;
                patchBlock(update.id, {
                  ...(typeof update.title === "string" ? { title: update.title.slice(0, 120) } : {}),
                  ...(update.url !== undefined ? { url: update.url } : {}),
                  ...(typeof update.isVisible === "boolean" ? { is_visible: update.isVisible } : {}),
                });
                appliedMutations += 1;
              }

              const removeSet = new Set(payload.removeBlockIds ?? []);
              const desiredOrder = (payload.order ?? []).filter((id) => !removeSet.has(id));
              desiredOrder.forEach((id, index) => moveBlock(id, index));
              if (desiredOrder.length > 0) appliedMutations += 1;

              for (const id of payload.duplicateBlockIds ?? []) {
                if (!bundle.blocks.some((block) => block.id === id)) continue;
                await duplicateBlock(id);
                appliedMutations += 1;
                await nextFrame();
              }

              for (const block of payload.addBlocks ?? []) {
                const createdId = await addBlock(block.type, {
                  ...(block.title !== undefined ? { title: block.title } : {}),
                  ...(block.url !== undefined ? { url: block.url } : {}),
                });
                if (createdId) appliedMutations += 1;
                await nextFrame();
              }

              for (const id of payload.removeBlockIds ?? []) {
                if (!bundle.blocks.some((block) => block.id === id)) continue;
                await removeBlock(id);
                appliedMutations += 1;
                await nextFrame();
              }

              return appliedMutations;
            }

            async function generate''')
          text = sub_once(
              text,
              r'  async function applyResult\(payload: AiResult\) \{[\s\S]*?\n  async function generate',
              new_apply,
              'replace applyResult',
          )
          text = sub_once(
              text,
              r'\n    requestAnimationFrame\(\(\) => \{\n      if \(composerRef\.current\) composerRef\.current\.style\.height = "52px";\n    \}\);',
              '',
              'remove composer resize reset',
          )
          text = sub_once(
              text,
              r'      await applyResult\(normalizedPayload\);\n      setMessages\(\(current\) => \[\n        \.\.\.current,\n        \{\n          id: `a-\$\{Date\.now\(\)\}`,\n          role: "assistant",\n          text: normalizedPayload\.message,\n          tips: normalizedPayload\.tips,\n        \},\n      \]\);',
              dedent('''
                    const requestedMutation =
                      normalizedPayload.bio !== (bundle.profile.bio ?? "") ||
                      normalizedPayload.linkTitles.length > 0 ||
                      Boolean(normalizedPayload.profile && Object.keys(normalizedPayload.profile).length > 0) ||
                      Boolean(normalizedPayload.theme && Object.keys(normalizedPayload.theme).length > 0) ||
                      Boolean(normalizedPayload.blocks?.length) ||
                      Boolean(normalizedPayload.order?.length) ||
                      Boolean(normalizedPayload.removeBlockIds?.length) ||
                      Boolean(normalizedPayload.duplicateBlockIds?.length) ||
                      Boolean(normalizedPayload.addBlocks?.length);
                    const appliedMutations = await applyResult(normalizedPayload);
                    const responseText =
                      requestedMutation && appliedMutations === 0
                        ? "Não consegui aplicar essa alteração na sua página. Tente novamente com os dados completos."
                        : normalizedPayload.message;

                    setMessages((current) => [
                      ...current,
                      {
                        id: `a-${Date.now()}`,
                        role: "assistant",
                        text: responseText,
                        tips: normalizedPayload.tips,
                      },
                    ]);'''),
              'guard false success',
          )

          new_return = dedent('''
            return (
              <section className="flex min-h-[850px] flex-col rounded-[1.5rem] border border-border/90 bg-card/95 shadow-panel xl:min-h-[872px]">
                <div className="flex items-center gap-3 border-b border-border/80 px-4 py-3.5 sm:px-5">
                  <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-primary/20 bg-primary/[0.08] text-primary">
                    <Bot className="h-4.5 w-4.5" />
                  </span>
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5">
                      <h2 className="truncate text-sm font-semibold text-foreground">Biofy AI</h2>
                      <Sparkles className="h-3.5 w-3.5 text-primary" />
                    </div>
                    <p className="truncate text-[11px] text-muted-foreground">Você pede. A Biofy aplica.</p>
                  </div>
                </div>

                <div aria-live="polite" className="flex flex-1 flex-col px-4 py-5 sm:px-5">
                  {messages.length === 0 ? (
                    <div className="flex flex-1 items-center justify-center py-12">
                      <div className="max-w-[300px] text-center animate-rise">
                        <span className="mx-auto flex h-11 w-11 items-center justify-center rounded-2xl border border-primary/15 bg-primary/[0.06] text-primary">
                          <Sparkles className="h-4.5 w-4.5" />
                        </span>
                        <h3 className="mt-4 text-sm font-semibold">Edite sua Bio com linguagem natural</h3>
                        <p className="mt-2 text-xs leading-5 text-muted-foreground">
                          Escreva o que quer mudar. A Biofy aplica as alterações compatíveis diretamente na página.
                        </p>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {messages.map((message) => (
                        <div
                          key={message.id}
                          className={`flex animate-rise items-end gap-2 ${
                            message.role === "user" ? "justify-end" : "justify-start"
                          }`}
                        >
                          {message.role === "assistant" ? (
                            <span className="mb-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-primary/15 bg-primary/[0.07] text-primary">
                              <Bot className="h-3.5 w-3.5" />
                            </span>
                          ) : null}
                          <div
                            className={`max-w-[86%] rounded-2xl px-4 py-3 text-sm leading-6 ${
                              message.role === "user"
                                ? "rounded-br-md bg-primary text-primary-foreground"
                                : "rounded-bl-md border border-border/80 bg-background/65 text-foreground"
                            }`}
                          >
                            <p className="whitespace-pre-wrap">{message.text}</p>
                            {message.tips && message.tips.length > 0 ? (
                              <div className="mt-3 space-y-1.5 border-t border-border/70 pt-3 text-xs leading-5 text-muted-foreground">
                                {message.tips.map((tip) => (
                                  <p key={tip}>• {tip}</p>
                                ))}
                              </div>
                            ) : null}
                          </div>
                        </div>
                      ))}

                      {loading ? (
                        <div className="flex animate-rise items-end justify-start gap-2">
                          <span className="mb-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-primary/15 bg-primary/[0.07] text-primary">
                            <Bot className="h-3.5 w-3.5" />
                          </span>
                          <div className="flex items-center gap-2 rounded-2xl rounded-bl-md border border-border/80 bg-background/65 px-4 py-3 text-xs text-muted-foreground">
                            <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary" />
                            <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:120ms]" />
                            <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:240ms]" />
                          </div>
                        </div>
                      ) : null}
                    </div>
                  )}
                </div>

                <div className="mt-auto border-t border-border/80 p-3 sm:p-4">
                  <div className="flex items-center gap-2 rounded-2xl border border-input/90 bg-background/80 p-1.5 shadow-sm transition-[border-color,box-shadow,background-color] duration-200 focus-within:border-primary/45 focus-within:bg-background focus-within:ring-2 focus-within:ring-primary/10">
                    <input
                      value={instruction}
                      maxLength={1000}
                      onChange={(event) => setInstruction(event.target.value)}
                      onKeyDown={(event) => {
                        if (event.key === "Enter") {
                          event.preventDefault();
                          void generate();
                        }
                      }}
                      placeholder="Peça uma alteração..."
                      className="h-10 min-w-0 flex-1 bg-transparent px-3 text-sm text-foreground outline-none placeholder:text-muted-foreground/65"
                    />
                    <button
                      type="button"
                      onClick={() => void generate()}
                      disabled={loading || !instruction.trim()}
                      aria-label="Enviar mensagem"
                      className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-foreground shadow-sm transition-all duration-200 hover:brightness-110 active:scale-95 disabled:cursor-not-allowed disabled:opacity-35"
                    >
                      <ArrowUp className="h-4 w-4" />
                    </button>
                  </div>
                </div>
              </section>
            );
            }
          ''')
          text = sub_once(text, r'  return \(\n    <section[\s\S]*\n  \);\n\}', new_return, 'replace AI render')
          p.write_text(text)

          # AI page layout and preview proportions.
          replace_once(
              "src/routes/dashboard.ai.tsx",
              'className="grid gap-5 xl:grid-cols-[minmax(340px,0.62fr)_minmax(600px,1.38fr)] xl:items-start"',
              'className="grid gap-5 xl:grid-cols-[minmax(340px,0.62fr)_minmax(600px,1.38fr)] xl:items-stretch"',
          )
          replace_once("src/routes/dashboard.ai.tsx", '<aside className="xl:sticky xl:top-6 xl:self-start">', '<aside className="h-full">')
          replace_once(
              "src/routes/dashboard.ai.tsx",
              '<div className="overflow-hidden rounded-[1.5rem] border border-border bg-card shadow-panel">',
              '<div className="h-full min-h-[850px] overflow-hidden rounded-[1.5rem] border border-border/90 bg-card/95 shadow-panel xl:min-h-[872px]">',
          )
          replace_once(
              "src/routes/dashboard.ai.tsx",
              '<div className="min-h-[760px] bg-black/15 p-4 2xl:min-h-[820px]">',
              '<div className="flex min-h-[760px] items-center justify-center bg-black/10 p-4 2xl:min-h-[820px]">',
          )
          replace_once(
              "src/routes/dashboard.ai.tsx",
              '<div className="h-[760px] overflow-auto rounded-xl border border-border/70 bg-background/35 animate-rise 2xl:h-[820px]">',
              '<div className="h-[720px] w-full overflow-hidden rounded-2xl border border-border/70 bg-background/35 animate-rise 2xl:h-[780px]">',
          )
          replace_once(
              "src/components/bio/BioPreview.tsx",
              'const panelMinHeight = compact ? "520px" : "min(800px, calc(100dvh - 40px))";',
              'const panelMinHeight = compact ? "660px" : "min(800px, calc(100dvh - 40px))";',
          )

          # WhatsApp number -> deterministic wa.me URL when the number is explicitly in the request.
          p = Path("src/routes/api.ai.bio.ts")
          text = p.read_text()
          text = sub_once(
              text,
              r'(function canUseRequestedUrl\(url: string, instruction: string\) \{\n  return url\.length <= 2048 && instruction\.includes\(url\);\n\})',
              r'''\1

function whatsappUrlFromInstruction(instruction: string) {
  const candidates = instruction.match(/\+?\d[\d\s().-]{8,}\d/g) ?? [];
  for (const candidate of candidates) {
    let digits = candidate.replace(/\D/g, "");
    if (digits.length === 10 || digits.length === 11) digits = `55${digits}`;
    if ((digits.length === 12 || digits.length === 13) && digits.startsWith("55")) {
      return `https://wa.me/${digits}`;
    }
  }
  return null;
}''',
              'insert WhatsApp URL helper',
          )
          start = text.index('  const addBlocks =')
          end = text.index('  const tips =', start)
          section = text[start:end]
          section = sub_once(
              section,
              r'(\n          if \(\n            typeof item\["url"\] === "string" &&[\s\S]*?\n          \} )(\n          return block;)',
              r'''\1else if (block.type === "whatsapp") {
            const whatsappUrl = whatsappUrlFromInstruction(instruction);
            if (whatsappUrl) block.url = whatsappUrl;
          }\2''',
              'add WhatsApp URL fallback',
          )
          text = text[:start] + section + text[end:]
          p.write_text(text)

          replace_once(
              "src/lib/biofy-ai-prompt.ts",
              '- Só altere URL de bloco se o usuário fornecer a URL exata no pedido atual; copie exatamente essa URL. Nunca invente destinos.',
              '- Só altere URL de bloco se o usuário fornecer a URL exata no pedido atual; copie exatamente essa URL. Exceção: para WhatsApp, se o usuário fornecer claramente o próprio número no pedido atual, converta esse número em https://wa.me/<digitos>; para número brasileiro com 10 ou 11 dígitos sem país, use 55. Nunca invente outros destinos.',
          )
          replace_once(
              "src/lib/biofy-ai-prompt.ts",
              'Sem URL fornecida no pedido atual, use url:null.',
              'Sem URL fornecida no pedido atual, use url:null, exceto WhatsApp quando houver número explícito no pedido atual.',
          )

          # Shared dashboard spacing polish.
          replace_once(
              "src/components/dashboard/DashboardShell.tsx",
              '<div className="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">',
              '<div className="mx-auto max-w-[1440px] px-4 py-7 sm:px-6 lg:px-8 lg:py-9 xl:px-10">',
          )
          PY
      - name: Format
        run: bunx prettier --write src/components/dashboard/BioAiAssistant.tsx src/routes/dashboard.ai.tsx src/components/bio/BioPreview.tsx src/routes/api.ai.bio.ts src/lib/biofy-ai-prompt.ts src/components/dashboard/DashboardShell.tsx
      - name: Validate
        run: |
          bun run build
          bunx tsc --noEmit
          bun run lint
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-ai-preview-once.yml
          git add src/components/dashboard/BioAiAssistant.tsx src/routes/dashboard.ai.tsx src/components/bio/BioPreview.tsx src/routes/api.ai.bio.ts src/lib/biofy-ai-prompt.ts src/components/dashboard/DashboardShell.tsx
          git commit -m "fix: refine Biofy AI workspace and block actions"
          git push origin HEAD:main
