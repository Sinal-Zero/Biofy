name: Finalize Biofy preview proportions

on:
  push:
    paths:
      - .github/workflows/preview-proportion-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Keep preview card vertical and fully visible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/bio/BioPreview.tsx')
          s = p.read_text()
          old = 'const panelMinHeight = compact ? "520px" : "min(800px, calc(100dvh - 40px))";'
          new = 'const panelMinHeight = compact ? "660px" : "min(800px, calc(100dvh - 40px))";'
          if old not in s:
              raise SystemExit('BioPreview panelMinHeight block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/routes/dashboard.ai.tsx')
          s = p.read_text()
          old = '''                    blocks={bundle.blocks}
                    showBranding={false}
                    className="h-full min-h-full"
                  />'''
          new = '''                    blocks={bundle.blocks}
                    compact
                    showBranding={false}
                  />'''
          if old not in s:
              raise SystemExit('desktop preview block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: bunx prettier --write src/components/bio/BioPreview.tsx src/routes/dashboard.ai.tsx
      - run: |
          bun run build
          bunx tsc --noEmit
          bun run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-proportion-once.yml
          git add src/components/bio/BioPreview.tsx src/routes/dashboard.ai.tsx
          git commit -m "fix: preserve vertical Biofy preview proportions"
          git push origin HEAD:main
