name: Biofy Gemini latency fix

on:
  push:
    paths:
      - .github/workflows/fix-gemini-timeout-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch Gemini latency path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/routes/api.ai.bio.ts',
              'const GEMINI_TIMEOUT_MS = 16000;',
              'const GEMINI_TIMEOUT_MS = 30000;',
          )
          replace(
              'src/routes/api.ai.bio.ts',
              'const DEFAULT_GEMINI_MODEL = "gemini-3.8-flash";',
              'const DEFAULT_GEMINI_MODEL = "gemini-3.5-flash-lite";',
          )
          replace(
              'src/routes/api.ai.bio.ts',
              'generation_config: { thinking_level: "low" },',
              'generation_config: { thinking_level: "minimal" },',
          )
          replace(
              'src/components/dashboard/BioAiAssistant.tsx',
              'signal: AbortSignal.timeout(22_000),',
              'signal: AbortSignal.timeout(35_000),',
          )
          PY
      - name: Format
        run: bunx prettier --write src/routes/api.ai.bio.ts src/components/dashboard/BioAiAssistant.tsx
      - name: Validate
        run: |
          bun run build
          bunx tsc --noEmit
          bun run lint
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-gemini-timeout-once.yml
          git add src/routes/api.ai.bio.ts src/components/dashboard/BioAiAssistant.tsx
          git commit -m "fix: reduce Biofy AI Gemini latency"
          git push origin HEAD:main
