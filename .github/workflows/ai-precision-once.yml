name: Biofy AI precision pass

on:
  push:
    paths:
      - .github/workflows/ai-precision-once.yml

permissions:
  contents: write

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply precision patch
        run: python3 .github/scripts/ai_precision.py
      - name: Fix strict index fallback
        run: sed -i 's/sizePadding\.md/{ x: 18, y: 14 }/' src/components/bio/BioPreview.tsx
      - name: Format
        run: bunx prettier --write src/lib/bio-types.ts src/lib/biofy-ai-prompt.ts src/routes/api.ai.bio.ts src/components/bio/BioPreview.tsx src/components/dashboard/BioAiAssistant.tsx src/components/dashboard/AiPrecisionHint.tsx src/routes/dashboard.editor.tsx src/routes/dashboard.appearance.tsx src/routes/dashboard.ai.tsx
      - name: Build and generate routes
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Commit validated changes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-precision-once.yml .github/scripts/ai_precision.py
          git add src
          git commit -m "feat: make Biofy AI precise and expand advanced editing"
          git push origin HEAD:main
