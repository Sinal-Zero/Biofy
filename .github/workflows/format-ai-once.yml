name: Format Biofy AI once

on:
  push:
    paths:
      - .github/workflows/format-ai-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/dashboard/BioAiAssistant.tsx
      - run: |
          bun run build
          bunx tsc --noEmit
          bun run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-ai-once.yml
          git add src/components/dashboard/BioAiAssistant.tsx
          git commit -m "style: format Biofy AI workspace"
          git push origin HEAD:main
