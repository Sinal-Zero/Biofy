name: Biofy AI one-time format

on:
  push:
    paths:
      - .github/workflows/format-ai-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Biofy AI files
        run: bunx prettier --write src/components/dashboard/BioAiAssistant.tsx src/components/dashboard/BioContext.tsx src/lib/biofy-ai-prompt.ts src/routes/api.ai.bio.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/BioAiAssistant.tsx src/components/dashboard/BioContext.tsx src/lib/biofy-ai-prompt.ts src/routes/api.ai.bio.ts
          git commit -m "style: format Biofy AI agent"
          git push origin HEAD:main
