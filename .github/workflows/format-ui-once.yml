name: Biofy UI one-time format

on:
  push:
    paths:
      - .github/workflows/format-ui-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format UI pass
        run: |
          bunx prettier --write \
            src/components/auth/AuthShell.tsx \
            src/components/bio/BioPreview.tsx \
            src/components/bio/PhoneFrame.tsx \
            src/components/dashboard/BioAiAssistant.tsx \
            src/components/dashboard/BioContext.tsx \
            src/components/dashboard/DashboardShell.tsx \
            src/components/ui/button.tsx \
            src/components/ui/input.tsx \
            src/components/ui/ScrollReveal.tsx \
            src/lib/public-url.ts \
            src/lib/subscription.ts \
            'src/routes/$username.tsx' \
            src/routes/dashboard.ai.tsx \
            src/routes/dashboard.analytics.tsx \
            src/routes/dashboard.appearance.tsx \
            src/routes/dashboard.index.tsx \
            src/routes/dashboard.settings.tsx \
            src/routes/dashboard.subscription.tsx \
            src/routes/index.tsx \
            src/routes/onboarding.tsx \
            src/styles.css

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format Biofy UI pass"
          git push origin HEAD:main
