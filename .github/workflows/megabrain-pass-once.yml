name: Biofy one-time hardening pass

on:
  push:
    paths:
      - .github/workflows/megabrain-pass-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply performance, UX and data patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Gemini: one fast GA model first, current v1beta Interactions endpoint,
          # low thinking for UI editing, fallback discovery only when needed.
          replace_once(
              "src/routes/api.ai.bio.ts",
              '''const GEMINI_TIMEOUT_MS = 25000;
          const INTERACTIONS_MODELS = [
            "gemini-3.8-flash",
            "gemini-3.7-flash",
            "gemini-3.6-flash",
            "gemini-3.5-flash",
            "gemini-3.5-flash-lite",
            "gemini-3.1-flash-lite",
          ] as const;
          ''',
              '''const GEMINI_TIMEOUT_MS = 16000;
          const DEFAULT_GEMINI_MODEL = "gemini-3.8-flash";
          const MODEL_CACHE_TTL_MS = 30 * 60 * 1000;
          const MAX_AI_BODY_BYTES = 96_000;
          const AI_RATE_WINDOW_MS = 60_000;
          const AI_RATE_LIMIT = 20;

          let cachedGenerateContentModel: { model: string; expiresAt: number } | null = null;
          let skipPrimaryInteractionUntil = 0;
          const aiRateBuckets = new Map<string, { count: number; resetAt: number }>();
          ''',
          )

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }
          ''',
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function allowAiRequest(userId: string) {
            const now = Date.now();
            const current = aiRateBuckets.get(userId);
            if (!current || current.resetAt <= now) {
              aiRateBuckets.set(userId, { count: 1, resetAt: now + AI_RATE_WINDOW_MS });
              return true;
            }
            if (current.count >= AI_RATE_LIMIT) return false;
            current.count += 1;
            return true;
          }
          ''',
          )

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''    const response = await fetch("https://generativelanguage.googleapis.com/v1/interactions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": geminiKey,
                },
                signal: AbortSignal.timeout(GEMINI_TIMEOUT_MS),
                body: JSON.stringify({ model, input: prompt, store: false }),
              });''',
              '''    const response = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": geminiKey,
                },
                signal: AbortSignal.timeout(GEMINI_TIMEOUT_MS),
                body: JSON.stringify({
                  model,
                  input: prompt,
                  store: false,
                  generation_config: { thinking_level: "low" },
                }),
              });''',
          )

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''async function discoverGenerateContentModel(geminiKey: string) {
            try {''',
              '''async function discoverGenerateContentModel(geminiKey: string) {
            if (cachedGenerateContentModel && cachedGenerateContentModel.expiresAt > Date.now()) {
              return { model: cachedGenerateContentModel.model, failure: null };
            }

            try {''',
          )

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''    return { model: preferred ?? fallback ?? null, failure: null };''',
              '''    const model = preferred ?? fallback ?? null;
              if (model) {
                cachedGenerateContentModel = { model, expiresAt: Date.now() + MODEL_CACHE_TTL_MS };
              }
              return { model, failure: null };''',
          )

          old_call = '''async function callGemini(geminiKey: string, prompt: string) {
            let lastFailure: GeminiAttempt = {
              detail: "",
              status: 0,
              timedOut: false,
              model: INTERACTIONS_MODELS[0],
              api: "interactions",
            };

            for (const model of INTERACTIONS_MODELS) {
              const attempt = await requestInteraction(geminiKey, model, prompt);
              if (attempt.response?.ok) {
                return {
                  success: {
                    response: attempt.response,
                    model,
                    api: "interactions" as const,
                  } satisfies GeminiSuccess,
                  failure: null,
                };
              }

              lastFailure = attempt;
              if ([400, 401, 403, 429].includes(attempt.status) || attempt.timedOut) {
                return { success: null, failure: attempt };
              }
            }

            const discovery = await discoverGenerateContentModel(geminiKey);
            if (discovery.model) {
              const legacyAttempt = await requestGenerateContent(geminiKey, discovery.model, prompt);
              if (legacyAttempt.response?.ok) {
                return {
                  success: {
                    response: legacyAttempt.response,
                    model: discovery.model,
                    api: "generateContent" as const,
                  } satisfies GeminiSuccess,
                  failure: null,
                };
              }
              lastFailure = legacyAttempt;
            } else if (discovery.failure) {
              lastFailure = discovery.failure;
            }

            return { success: null, failure: lastFailure };
          }'''
          new_call = '''async function callGemini(geminiKey: string, prompt: string) {
            const primaryModel = process.env["GEMINI_MODEL"]?.trim() || DEFAULT_GEMINI_MODEL;
            let lastFailure: GeminiAttempt = {
              detail: "interaction_unavailable_cached",
              status: 404,
              timedOut: false,
              model: primaryModel,
              api: "interactions",
            };

            if (Date.now() >= skipPrimaryInteractionUntil) {
              const attempt = await requestInteraction(geminiKey, primaryModel, prompt);
              if (attempt.response?.ok) {
                return {
                  success: {
                    response: attempt.response,
                    model: primaryModel,
                    api: "interactions" as const,
                  } satisfies GeminiSuccess,
                  failure: null,
                };
              }

              lastFailure = attempt;
              if ([401, 403, 429].includes(attempt.status) || attempt.timedOut) {
                return { success: null, failure: attempt };
              }

              if (attempt.status === 400 || attempt.status === 404) {
                skipPrimaryInteractionUntil = Date.now() + MODEL_CACHE_TTL_MS;
              } else if (attempt.status > 0) {
                return { success: null, failure: attempt };
              }
            }

            const discovery = await discoverGenerateContentModel(geminiKey);
            if (discovery.model) {
              const fallbackAttempt = await requestGenerateContent(geminiKey, discovery.model, prompt);
              if (fallbackAttempt.response?.ok) {
                return {
                  success: {
                    response: fallbackAttempt.response,
                    model: discovery.model,
                    api: "generateContent" as const,
                  } satisfies GeminiSuccess,
                  failure: null,
                };
              }
              lastFailure = fallbackAttempt;
            } else if (discovery.failure) {
              lastFailure = discovery.failure;
            }

            return { success: null, failure: lastFailure };
          }'''
          replace_once("src/routes/api.ai.bio.ts", old_call, new_call)

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''        const authorization = request.headers.get("authorization");''',
              '''        const contentType = request.headers.get("content-type") ?? "";
                if (!contentType.toLowerCase().includes("application/json")) {
                  return Response.json({ error: "Formato de pedido inválido." }, { status: 415 });
                }

                const contentLength = Number(request.headers.get("content-length") ?? 0);
                if (Number.isFinite(contentLength) && contentLength > MAX_AI_BODY_BYTES) {
                  return Response.json({ error: "Pedido grande demais." }, { status: 413 });
                }

                const authorization = request.headers.get("authorization");''',
          )

          old_auth = '''        const authHeaders = { apikey: supabaseKey, Authorization: `Bearer ${accessToken}` };
                const userResponse = await fetch(`${supabaseUrl}/auth/v1/user`, { headers: authHeaders });
                if (!userResponse.ok) {
                  return Response.json({ error: "Sessão inválida ou expirada." }, { status: 401 });
                }

                const user = (await userResponse.json()) as { id?: string };
                if (!user.id) return Response.json({ error: "Usuário inválido." }, { status: 401 });

                const subscriptionResponse = await fetch(
                  `${supabaseUrl}/rest/v1/subscriptions?user_id=eq.${encodeURIComponent(user.id)}&select=plan,status,current_period_end&limit=1`,
                  { headers: authHeaders },
                );
                if (!subscriptionResponse.ok) {
                  return Response.json({ error: "Não foi possível validar seu plano." }, { status: 403 });
                }

                const subscriptions = (await subscriptionResponse.json()) as Array<{'''
          new_auth = '''        const authHeaders = { apikey: supabaseKey, Authorization: `Bearer ${accessToken}` };
                const [userResponse, subscriptionResponse] = await Promise.all([
                  fetch(`${supabaseUrl}/auth/v1/user`, {
                    headers: authHeaders,
                    signal: AbortSignal.timeout(10_000),
                  }),
                  fetch(
                    `${supabaseUrl}/rest/v1/subscriptions?select=plan,status,current_period_end&limit=1`,
                    { headers: authHeaders, signal: AbortSignal.timeout(10_000) },
                  ),
                ]);

                if (!userResponse.ok) {
                  return Response.json({ error: "Sessão inválida ou expirada." }, { status: 401 });
                }
                if (!subscriptionResponse.ok) {
                  return Response.json({ error: "Não foi possível validar seu plano." }, { status: 403 });
                }

                const user = (await userResponse.json()) as { id?: string };
                if (!user.id) return Response.json({ error: "Usuário inválido." }, { status: 401 });

                const subscriptions = (await subscriptionResponse.json()) as Array<{'''
          replace_once("src/routes/api.ai.bio.ts", old_auth, new_auth)

          replace_once(
              "src/routes/api.ai.bio.ts",
              '''        if (!isMaster || !activeStatus || !periodActive) {
                  return Response.json(
                    { error: "A Biofy AI é exclusiva do plano Master." },
                    { status: 403 },
                  );
                }

                const body =''',
              '''        if (!isMaster || !activeStatus || !periodActive) {
                  return Response.json(
                    { error: "A Biofy AI é exclusiva do plano Master." },
                    { status: 403 },
                  );
                }

                if (!allowAiRequest(user.id)) {
                  return Response.json(
                    { error: "Muitas solicitações em pouco tempo. Aguarde alguns segundos." },
                    { status: 429, headers: { "Retry-After": "60", "Cache-Control": "no-store" } },
                  );
                }

                const body =''',
          )

          replace_once("src/routes/api.ai.bio.ts", ".slice(-6)\n", ".slice(-4)\n")
          replace_once("src/routes/api.ai.bio.ts", 'text: String(item.text ?? "").slice(0, 500),', 'text: String(item.text ?? "").slice(0, 400),')

          # Data minimization: never expose billing provider IDs to the browser and
          # avoid storing full referrer paths/query strings in analytics.
          replace_once(
              "src/lib/bio-data.ts",
              '''export async function fetchSubscription(userId: string) {
            const { data, error } = await supabase
              .from("subscriptions")
              .select("*")
              .eq("user_id", userId)
              .maybeSingle();
            if (error) throw error;
            return data;
          }

          export async function recordAnalytics(''',
              '''export async function fetchSubscription(userId: string) {
            const { data, error } = await supabase
              .from("subscriptions")
              .select("plan,status,current_period_end,cancel_at_period_end")
              .eq("user_id", userId)
              .maybeSingle();
            if (error) throw error;
            return data;
          }

          function safeReferrerOrigin() {
            if (typeof document === "undefined" || !document.referrer) return null;
            try {
              return new URL(document.referrer).origin.slice(0, 300);
            } catch {
              return null;
            }
          }

          export async function recordAnalytics(''',
          )
          replace_once(
              "src/lib/bio-data.ts",
              '''    referrer: typeof document !== "undefined" ? document.referrer.slice(0, 1000) || null : null,''',
              '''    referrer: safeReferrerOrigin(),''',
          )

          # Keep Master gating identical everywhere.
          replace_once(
              "src/components/dashboard/DashboardShell.tsx",
              '''import { fetchSubscription } from "@/lib/bio-data";
          import { useBio } from "./BioContext";''',
              '''import { fetchSubscription } from "@/lib/bio-data";
          import { isMasterSubscription } from "@/lib/subscription";
          import { useBio } from "./BioContext";''',
          )
          replace_once(
              "src/components/dashboard/DashboardShell.tsx",
              '''        const active =
                  !subscription?.status || ["active", "trialing"].includes(subscription.status);
                const periodActive =
                  !subscription?.current_period_end ||
                  new Date(subscription.current_period_end).getTime() >= Date.now();
                setIsMaster(subscription?.plan === "business" && active && periodActive);''',
              '''        setIsMaster(isMasterSubscription(subscription));''',
          )

          replace_once(
              "src/routes/dashboard.ai.tsx",
              '''import { fetchSubscription } from "@/lib/bio-data";
          import { getPublicBioDisplay } from "@/lib/public-url";''',
              '''import { fetchSubscription } from "@/lib/bio-data";
          import { getPublicBioDisplay } from "@/lib/public-url";
          import { isMasterSubscription } from "@/lib/subscription";''',
          )
          replace_once(
              "src/routes/dashboard.ai.tsx",
              '''        const active =
                  !subscription?.status || ["active", "trialing"].includes(subscription.status);
                const periodActive =
                  !subscription?.current_period_end ||
                  new Date(subscription.current_period_end).getTime() >= Date.now();
                setIsMaster(subscription?.plan === "business" && active && periodActive);''',
              '''        setIsMaster(isMasterSubscription(subscription));''',
          )

          replace_once(
              "src/routes/dashboard.subscription.tsx",
              '''import { fetchSubscription } from "@/lib/bio-data";''',
              '''import { fetchSubscription } from "@/lib/bio-data";
          import { isPaidSubscription } from "@/lib/subscription";''',
          )
          replace_once(
              "src/routes/dashboard.subscription.tsx",
              '''  const paidPlan = currentPlan === "pro" || currentPlan === "business";
            const activeStatus =
              !subscription?.status || ["active", "trialing"].includes(subscription.status);
            const periodActive =
              !subscription?.current_period_end ||
              new Date(subscription.current_period_end).getTime() >= Date.now();
            const hasPaidSubscription = paidPlan && activeStatus && periodActive;''',
              '''  const paidPlan = currentPlan === "pro" || currentPlan === "business";
            const hasPaidSubscription = isPaidSubscription(subscription);''',
          )

          # AI composer: quick actions execute immediately and client abandons stalled requests.
          replace_once(
              "src/components/dashboard/BioAiAssistant.tsx",
              '''  function chooseQuickPrompt(prompt: string) {
            setInstruction(prompt);
            requestAnimationFrame(() => {
              resizeComposer();
              composerRef.current?.focus();
            });
          }

          async function applyResult''',
              '''  async function applyResult''',
          )
          replace_once(
              "src/components/dashboard/BioAiAssistant.tsx",
              '''  async function generate() {
            const cleanInstruction = instruction.trim();''',
              '''  async function generate(overrideInstruction?: string) {
            const cleanInstruction = (overrideInstruction ?? instruction).trim();''',
          )
          replace_once("src/components/dashboard/BioAiAssistant.tsx", "messages.slice(-6)", "messages.slice(-4)")
          replace_once(
              "src/components/dashboard/BioAiAssistant.tsx",
              '''        headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify({''',
              '''        headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                signal: AbortSignal.timeout(22_000),
                body: JSON.stringify({''',
          )
          replace_once(
              "src/components/dashboard/BioAiAssistant.tsx",
              '''                    onClick={() => chooseQuickPrompt(prompt)}''',
              '''                    onClick={() => void generate(prompt)}''',
          )
          replace_once(
              "src/components/dashboard/BioAiAssistant.tsx",
              '''                <div className="flex items-center gap-1.5 rounded-2xl rounded-bl-md border border-border bg-background/75 px-4 py-3 shadow-sm">
                  <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary" />
                  <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:120ms]" />
                  <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:240ms]" />
                </div>''',
              '''                <div className="flex items-center gap-2 rounded-2xl rounded-bl-md border border-border bg-background/75 px-4 py-3 text-xs text-muted-foreground shadow-sm">
                  <span className="flex items-center gap-1.5" aria-hidden="true">
                    <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary" />
                    <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:120ms]" />
                    <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-primary [animation-delay:240ms]" />
                  </span>
                  Aplicando
                </div>''',
          )

          # Motion polish: shorter travel/blur and calmer menu/page transitions.
          replace_once("src/styles.css", "transform: translateY(-8px);", "transform: translateY(-5px);")
          replace_once(
              "src/styles.css",
              '''  from {
              opacity: 0;
              transform: translateY(12px);
              filter: blur(2px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
              filter: blur(0);
            }''',
              '''  from {
              opacity: 0;
              transform: translateY(9px) scale(0.995);
              filter: blur(1px);
            }
            to {
              opacity: 1;
              transform: translateY(0) scale(1);
              filter: blur(0);
            }''',
          )
          replace_once(
              "src/styles.css",
              '''  0% {
              opacity: 0;
              transform: scale(0.94);
            }
            100% {
              opacity: 1;
              transform: scale(1);
            }''',
              '''  0% {
              opacity: 0;
              transform: translateY(3px) scale(0.975);
            }
            100% {
              opacity: 1;
              transform: translateY(0) scale(1);
            }''',
          )
          replace_once("src/styles.css", "animation: biofy-rise 0.5s", "animation: biofy-rise 0.45s")
          replace_once("src/styles.css", "animation: biofy-pop 0.3s", "animation: biofy-pop 0.22s")
          replace_once(
              "src/styles.css",
              '''    overflow-x: hidden;
                background-color: var(--color-background);''',
              '''    overflow-x: hidden;
                overscroll-behavior-x: none;
                background-color: var(--color-background);''',
          )
          replace_once(
              "src/styles.css",
              '''  :where(a, button) {
                touch-action: manipulation;
              }''',
              '''  :where(a, button) {
                touch-action: manipulation;
              }

              :where(button, [role="button"]) {
                user-select: none;
              }''',
          )

          # Public Bio gets one restrained entrance animation; content remains top-aligned.
          replace_once(
              "src/components/bio/BioPreview.tsx",
              '''          "relative w-full overflow-x-hidden overflow-y-auto border shadow-[0_28px_80px_-40px_rgba(0,0,0,0.76)] transition-all duration-300",''',
              '''          "relative w-full transform-gpu overflow-x-hidden overflow-y-auto border shadow-[0_28px_80px_-40px_rgba(0,0,0,0.76)] transition-all duration-300 motion-safe:animate-rise",''',
          )
          PY

      - name: Format changed files
        run: |
          bunx prettier --write \
            src/routes/api.ai.bio.ts \
            src/lib/bio-data.ts \
            src/components/dashboard/DashboardShell.tsx \
            src/routes/dashboard.ai.tsx \
            src/routes/dashboard.subscription.tsx \
            src/components/dashboard/BioAiAssistant.tsx \
            src/styles.css \
            src/components/bio/BioPreview.tsx

      - name: Validate
        run: |
          bun run build
          bunx tsc --noEmit
          bun run lint

      - name: Commit pass
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "perf: harden and accelerate Biofy experience"
          git push origin HEAD:main
