name: Biofy one-time autofix

# Temporary workflow: remove after the repository is clean.
on:
  push:
    paths:
      - .github/workflows/autofix-once.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply safe ESLint fixes
        run: bunx eslint . --fix || true

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No autofixes were necessary."
            exit 0
          fi
          git config user.name "Biofy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: apply final lint autofixes"
          git push origin HEAD:main
