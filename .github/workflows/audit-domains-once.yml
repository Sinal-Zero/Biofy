name: Biofy domain audit

on:
  push:
    paths:
      - .github/workflows/audit-domains-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find Biofy domain references
        shell: bash
        run: |
          echo '=== DOMAIN-LIKE REFERENCES ==='
          grep -RInE --exclude-dir=.git --exclude='bun.lock' '(bio[-]?fy\.(app|vercel\.app)|[A-Za-z0-9.-]+\.vercel\.app)' . || true
          echo '=== ALL VERCEL REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='bun.lock' 'vercel.app' . || true
