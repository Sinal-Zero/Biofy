name: Apply requested Biofy updates

on:
  push:
    paths:
      - .github/workflows/apply-requested-updates.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply requested changes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Landing pricing + Business AI feature.
          replace("src/routes/index.tsx", 'price: "R$ 9,90/mês",', 'price: "R$ 21,90/mês",')
          replace("src/routes/index.tsx", 'price: "R$ 19,90/mês",', 'price: "R$ 41,90/mês",')
          replace(
              "src/routes/index.tsx",
              '      "Tudo do Pro",\n      "Recursos profissionais",',
              '      "Tudo do Pro",\n      "Assistente de IA para montar sua Bio",\n      "Recursos profissionais",',
          )

          # Dashboard subscription pricing + Business AI feature.
          replace("src/routes/dashboard.subscription.tsx", 'price: "R$ 9,90/mês",', 'price: "R$ 21,90/mês",')
          replace("src/routes/dashboard.subscription.tsx", 'price: "R$ 19,90/mês",', 'price: "R$ 41,90/mês",')
          replace(
              "src/routes/dashboard.subscription.tsx",
              '      "Tudo do Pro",\n      "Recursos profissionais",',
              '      "Tudo do Pro",\n      "Assistente de IA para montar sua Bio",\n      "Recursos profissionais",',
          )

          # Let login and signup choose the correct OAuth return destination.
          replace(
              "src/components/auth/GoogleButton.tsx",
              'export function GoogleButton({ label = "Continuar com Google" }: { label?: string }) {',
              'export function GoogleButton({\n  label = "Continuar com Google",\n  redirectPath = "/dashboard",\n}: {\n  label?: string;\n  redirectPath?: "/dashboard" | "/onboarding";\n}) {',
          )
          replace(
              "src/components/auth/GoogleButton.tsx",
              'redirectTo: `${window.location.origin}/dashboard`,',
              'redirectTo: `${window.location.origin}${redirectPath}`,',
          )
          replace(
              "src/routes/login.tsx",
              '<GoogleButton label="Entrar com Google" />',
              '<GoogleButton label="Entrar com Google" redirectPath="/dashboard" />',
          )
          replace(
              "src/routes/signup.tsx",
              'emailRedirectTo: `${window.location.origin}/dashboard`,',
              'emailRedirectTo: `${window.location.origin}/onboarding`,',
          )
          replace(
              "src/routes/signup.tsx",
              '<GoogleButton label="Criar conta com Google" />',
              '<GoogleButton label="Criar conta com Google" redirectPath="/onboarding" />',
          )

          # Keep the product specification consistent with the app.
          replace("README.md", "R$ 9,90/mês", "R$ 21,90/mês")
          replace("README.md", "R$ 19,90/mês", "R$ 41,90/mês")
          replace(
              "README.md",
              "Tudo do Pro\n\nDomínio personalizado",
              "Tudo do Pro\n\nAssistente de IA para montar a Bio a partir das orientações do usuário\n\nDomínio personalizado",
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "Biofy CI"
          git config user.email "actions@users.noreply.github.com"
          git add src README.md
          git commit -m "feat: update plans and prepare Google auth flow"
          git push origin HEAD:main
